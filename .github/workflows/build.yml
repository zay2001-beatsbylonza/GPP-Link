name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Vet and build the hub
        working-directory: hub
        run: |
          go vet ./...
          go build -o ../hub-linux .
      - name: Build mpclink-cli (strict warnings)
        run: cc -std=c99 -Wall -Wextra -Werror -O2 -o cli-linux plugin-core/mpclink.c plugin-core/mpclink_cli.c
      - name: End-to-end test
        run: sh tests/e2e.sh ./hub-linux ./cli-linux

  mac-hub:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build for Apple Silicon and Intel Macs
        working-directory: hub
        run: |
          mkdir -p "../dist/GPP Link"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "../dist/GPP Link/gpp-link-hub-apple-silicon" .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "../dist/GPP Link/gpp-link-hub-intel" .
          cp "Start GPP Link.command" ../README.md ../THANK-YOU.txt ../docs/GPP-Link-Quick-Start.pdf ../docs/GPP-Link-How-To-Guide.pdf "../dist/GPP Link/"
          chmod +x "../dist/GPP Link/"*.command "../dist/GPP Link/"gpp-link-hub-*
      - name: Zip (keeps the run permissions)
        working-directory: dist
        run: zip -r -X GPP-Link-Mac.zip "GPP Link"
      - uses: actions/upload-artifact@v4
        with:
          name: GPP-Link-Mac
          path: dist/GPP-Link-Mac.zip

  mpc-cli:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - gen: gen1
            arch: armv7
            cc: arm-linux-gnueabihf-gcc
            pkg: gcc-arm-linux-gnueabihf
          - gen: gen2
            arch: aarch64
            cc: aarch64-linux-gnu-gcc
            pkg: gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.pkg }}
      - name: Build static mpclink-cli for MPC ${{ matrix.gen }}
        run: |
          ${{ matrix.cc }} -std=c99 -Wall -Wextra -Werror -O2 -static \
            -o mpclink-cli plugin-core/mpclink.c plugin-core/mpclink_cli.c
          file mpclink-cli
      - uses: actions/upload-artifact@v4
        with:
          name: mpclink-cli-${{ matrix.gen }}-${{ matrix.arch }}
          path: mpclink-cli

  plugin:
    needs: test
    runs-on: ubuntu-24.04
    env:
      SDK_COMMIT: febd2ca5bd9eb16c4a412837196e145566bc981b   # Akai MPC Plugin SDK, the version this was tested with
    steps:
      - uses: actions/checkout@v4
      - name: Get Akai's MPC Plugin SDK
        uses: actions/checkout@v4
        with:
          repository: inmusic-software/mpc-plugin-builder-sdk
          ref: ${{ env.SDK_COMMIT }}
          path: sdk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build the plugin for Gen1 (arm32) and Gen2 (arm64)
        run: python sdk/tools/build.py plugin
      - name: SDK host simulator test
        run: sdk/.sdk-tools/host_sim plugin/build/native/gpp-link.so test --wav plugin/build/test.wav
      - name: Plugin in a pretend MPC, against a live hub
        run: |
          (cd hub && go build -o ../hub-linux .)
          c++ -std=c++17 -Wall -Wextra -O1 -Isdk/framework tests/plugin_host_test.cpp -ldl -lpthread -o plugin_host_test
          sh tests/plugin_test.sh ./hub-linux ./plugin_host_test plugin/build/native/gpp-link.so
      - name: Add the thank-you note and quick start to the plugin folder
        run: cp THANK-YOU.txt docs/GPP-Link-Quick-Start.pdf "plugin/build/BeatsbyLonza - VST - GPP Link/"
      - name: Package
        run: python sdk/tools/package.py plugin --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: GPP-Link-Plugin
          path: dist/*.zip
      # The Open MPC catalog's release zips (one per MPC generation, plus Akai's one-folder SDK zip), checked by the catalog's own tools.
      - name: Get Open MPC's release tools
        uses: actions/checkout@v4
        with:
          repository: open-mpc/mpc-vst-plugins
          ref: 8ace10a277784689c6d0e3281c0e8d6ddc14e220
          path: openmpc
      - name: Make and check the catalog release zips
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("plugin/plugin.json"))["version"])')
          case "$GITHUB_REF" in refs/tags/v*) [ "${GITHUB_REF#refs/tags/v}" = "$VERSION" ] || { echo "::error::tag $GITHUB_REF_NAME does not match plugin.json version $VERSION"; exit 1; };; esac
          mkdir -p release
          python3 openmpc/tools/sdk_release.py "plugin/build/BeatsbyLonza - VST - GPP Link" --version "$VERSION" \
            --id gpp-link --repo "$GITHUB_REPOSITORY" --license MIT \
            --about "Send beats between your MPC, the Beats folder on your Mac and Get Producers Paid, with a cassette player to preview them" \
            --requires "Wi-Fi turned on on the MPC, and the GPP Link hub running on your Mac on the same network (GPP-Link-Mac in this release)" \
            -o release
          for z in release/*-mpc-armv7.zip release/*-mpc-aarch64.zip; do python3 openmpc/tools/catalog_check.py "$z" --catalog; done
          python3 openmpc/tools/sdk_zip.py "release/GPP-Link-$VERSION-mpc-sdk.zip" release/*-mpc-armv7.zip release/*-mpc-aarch64.zip
          ls -l release
      - uses: actions/upload-artifact@v4
        with:
          name: GPP-Link-Release
          path: release/*.zip

  # Publish a release on GitHub with a tag like v1.0.0 (matching plugin.json) and this attaches the files to it.
  release:
    if: github.event_name == 'release'
    needs: [mac-hub, plugin]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Attach the files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber art/GPP-Link-Release/*.zip art/GPP-Link-Mac/*.zip
