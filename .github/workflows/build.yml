name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Vet and build the hub
        working-directory: hub
        run: |
          go vet ./...
          go build -o ../hub-linux .
      - name: Build mpclink-cli (strict warnings)
        run: cc -std=c99 -Wall -Wextra -Werror -O2 -o cli-linux plugin-core/mpclink.c plugin-core/mpclink_cli.c
      - name: End-to-end test
        run: sh tests/e2e.sh ./hub-linux ./cli-linux

  mac-hub:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build for Apple Silicon and Intel Macs
        working-directory: hub
        run: |
          mkdir -p "../dist/GPP Link"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.build=${GITHUB_SHA::7}" -o "../dist/GPP Link/gpp-link-hub-apple-silicon" .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.build=${GITHUB_SHA::7}" -o "../dist/GPP Link/gpp-link-hub-intel" .
          cp "Start GPP Link.command" ../README.md ../THANK-YOU.txt ../docs/GPP-Link-Quick-Start.pdf ../docs/GPP-Link-How-To-Guide.pdf ../docs/Picture-Guide-*.png "../dist/GPP Link/"
          chmod +x "../dist/GPP Link/"*.command "../dist/GPP Link/"gpp-link-hub-*
      - name: Zip (keeps the run permissions)
        working-directory: dist
        run: zip -r -X GPP-Link-Mac.zip "GPP Link"
      - uses: actions/upload-artifact@v4
        with:
          name: GPP-Link-Mac
          path: dist/GPP-Link-Mac.zip

  windows-hub:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build for Windows (64-bit Intel/AMD and ARM)
        working-directory: hub
        run: |
          mkdir -p "../dist/GPP Link"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.build=${GITHUB_SHA::7}" -o "../dist/GPP Link/gpp-link-hub.exe" .
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.build=${GITHUB_SHA::7}" -o "../dist/GPP Link/gpp-link-hub-arm64.exe" .
          cp "Start GPP Link.bat" "Windows - Read Me First.txt" ../THANK-YOU.txt ../docs/GPP-Link-Quick-Start.pdf ../docs/GPP-Link-How-To-Guide.pdf ../docs/Picture-Guide-*.png "../dist/GPP Link/"
          # Windows needs CRLF line ends in the .bat and text files
          sed -i 's/\r*$/\r/' "../dist/GPP Link/Start GPP Link.bat" "../dist/GPP Link/Windows - Read Me First.txt" "../dist/GPP Link/THANK-YOU.txt"
      - name: Zip
        working-directory: dist
        run: zip -r -X GPP-Link-Windows.zip "GPP Link"
      - uses: actions/upload-artifact@v4
        with:
          name: GPP-Link-Windows
          path: dist/GPP-Link-Windows.zip

  # The hub on a real Mac: unit tests, including saving the Get Producers Paid token in the Keychain.
  mac-smoke:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Unit tests on macOS (including the Keychain)
        working-directory: hub
        env:
          GPP_SECRET_STORE_TEST: '1'
        run: go test -v -run 'SystemSecretStore|GetProducersPaid' ./... && go test ./...

  # The hub on a real Windows machine: unit tests, then a quick run against a temporary Beats folder.
  windows-smoke:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Unit tests on Windows (including Credential Manager)
        working-directory: hub
        env:
          GPP_SECRET_STORE_TEST: '1'
        run: go test -v -run 'SystemSecretStore|GetProducersPaid' ./... && go test ./...
      - name: Run the hub and talk to it like an MPC
        working-directory: hub
        run: |
          go build -o hub.exe .
          $beats = Join-Path $env:RUNNER_TEMP "My Beats"
          New-Item -ItemType Directory -Force -Path (Join-Path $beats "Beats 2026") | Out-Null
          # a 1-second 16-bit stereo WAV
          $n = 44100; $data = New-Object byte[] ($n * 4)
          $hdr = [byte[]](0x52,0x49,0x46,0x46) + [BitConverter]::GetBytes([int](36 + $data.Length)) + [byte[]](0x57,0x41,0x56,0x45,0x66,0x6d,0x74,0x20,16,0,0,0,1,0,2,0) + [BitConverter]::GetBytes([int]44100) + [BitConverter]::GetBytes([int]176400) + [byte[]](4,0,16,0,0x64,0x61,0x74,0x61) + [BitConverter]::GetBytes([int]$data.Length)
          [IO.File]::WriteAllBytes((Join-Path $beats "Beats 2026\Trap Beat 140.wav"), [byte[]]($hdr + $data))
          $p = Start-Process -FilePath .\hub.exe -ArgumentList @("--dir", "`"$beats`"", "--name", "WinTest") -PassThru -RedirectStandardOutput hub.out -RedirectStandardError hub.err
          Start-Sleep -Seconds 2
          $h = @{ "X-MPC-Device" = "MPC Test" }
          $hello = Invoke-RestMethod -Uri http://127.0.0.1:47800/api/hello -Headers $h
          if ($hello.name -ne "WinTest") { throw "hello: $($hello | ConvertTo-Json)" }
          $list = Invoke-WebRequest -Uri "http://127.0.0.1:47800/api/list?format=tsv" -Headers $h
          if ($list.Content -notmatch "Beats 2026/Trap Beat 140.wav") { throw "list: $($list.Content)" }
          $pv = Invoke-WebRequest -Uri "http://127.0.0.1:47800/api/preview?path=Beats%202026/Trap%20Beat%20140.wav" -Headers $h
          if ($pv.RawContentLength -lt 170000) { throw "preview too short: $($pv.RawContentLength)" }
          Invoke-WebRequest -Method Put -Uri "http://127.0.0.1:47800/api/upload?path=Chops/snare.wav" -Headers $h -Body ([byte[]](1,2,3)) | Out-Null
          if (-not (Test-Path (Join-Path $beats "From MPC\MPC Test\Chops\snare.wav"))) { throw "upload did not land" }
          foreach ($bad in @("..%5Cx.wav", "CON.wav", "C:x.wav", "a.wav:s")) {
            try { Invoke-WebRequest -Method Put -Uri "http://127.0.0.1:47800/api/upload?path=$bad" -Headers $h -Body ([byte[]](1)) | Out-Null; throw "accepted $bad" }
            catch { if ($_.Exception.Message -like "accepted*") { throw } }
          }
          Stop-Process -Id $p.Id
          Get-Content hub.out
          "windows smoke: all checks passed"

  mpc-cli:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - gen: gen1
            arch: armv7
            cc: arm-linux-gnueabihf-gcc
            pkg: gcc-arm-linux-gnueabihf
          - gen: gen2
            arch: aarch64
            cc: aarch64-linux-gnu-gcc
            pkg: gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.pkg }}
      - name: Build static mpclink-cli for MPC ${{ matrix.gen }}
        run: |
          ${{ matrix.cc }} -std=c99 -Wall -Wextra -Werror -O2 -static \
            -o mpclink-cli plugin-core/mpclink.c plugin-core/mpclink_cli.c
          file mpclink-cli
      - uses: actions/upload-artifact@v4
        with:
          name: mpclink-cli-${{ matrix.gen }}-${{ matrix.arch }}
          path: mpclink-cli

  plugin:
    needs: test
    runs-on: ubuntu-24.04
    env:
      SDK_COMMIT: febd2ca5bd9eb16c4a412837196e145566bc981b   # Akai MPC Plugin SDK, the version this was tested with
    steps:
      - uses: actions/checkout@v4
      - name: Get Akai's MPC Plugin SDK
        uses: actions/checkout@v4
        with:
          repository: inmusic-software/mpc-plugin-builder-sdk
          ref: ${{ env.SDK_COMMIT }}
          path: sdk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build the plugin for Gen1 (arm32) and Gen2 (arm64)
        run: python sdk/tools/build.py plugin
      - name: SDK host simulator test
        run: sdk/.sdk-tools/host_sim plugin/build/native/gpp-link.so test --wav plugin/build/test.wav
      - name: Plugin in a pretend MPC, against a live hub
        run: |
          (cd hub && go build -o ../hub-linux .)
          c++ -std=c++17 -Wall -Wextra -O1 -Isdk/framework tests/plugin_host_test.cpp -ldl -lpthread -o plugin_host_test
          sh tests/plugin_test.sh ./hub-linux ./plugin_host_test plugin/build/native/gpp-link.so
      - name: Add the thank-you note and quick start to the plugin folder
        run: cp THANK-YOU.txt docs/GPP-Link-Quick-Start.pdf "plugin/build/BeatsbyLonza - VST - GPP Link/"
      - name: Package
        run: python sdk/tools/package.py plugin --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: GPP-Link-Plugin
          path: dist/*.zip
      # The Open MPC catalog's release zips (one per MPC generation, plus Akai's one-folder SDK zip), checked by the catalog's own tools.
      - name: Get Open MPC's release tools
        uses: actions/checkout@v4
        with:
          repository: open-mpc/mpc-vst-plugins
          ref: 8ace10a277784689c6d0e3281c0e8d6ddc14e220
          path: openmpc
      - name: Make and check the catalog release zips
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("plugin/plugin.json"))["version"])')
          case "$GITHUB_REF" in refs/tags/v*) [ "${GITHUB_REF#refs/tags/v}" = "$VERSION" ] || { echo "::error::tag $GITHUB_REF_NAME does not match plugin.json version $VERSION"; exit 1; };; esac
          mkdir -p release
          python3 openmpc/tools/sdk_release.py "plugin/build/BeatsbyLonza - VST - GPP Link" --version "$VERSION" \
            --id gpp-link --repo "$GITHUB_REPOSITORY" --license MIT \
            --about "Send beats between your MPC, the Beats folder on your Mac and Get Producers Paid, with a cassette player to preview them" \
            --requires "Wi-Fi turned on on the MPC, and the GPP Link hub running on your Mac on the same network (GPP-Link-Mac in this release)" \
            -o release
          for z in release/*-mpc-armv7.zip release/*-mpc-aarch64.zip; do python3 openmpc/tools/catalog_check.py "$z" --catalog; done
          python3 openmpc/tools/sdk_zip.py "release/GPP-Link-$VERSION-mpc-sdk.zip" release/*-mpc-armv7.zip release/*-mpc-aarch64.zip
          ls -l release
      - uses: actions/upload-artifact@v4
        with:
          name: GPP-Link-Release
          path: release/*.zip

  # Publish a release on GitHub with a tag like v1.0.0 (matching plugin.json) and this attaches the files to it.
  release:
    if: github.event_name == 'release'
    needs: [mac-hub, mac-smoke, windows-hub, windows-smoke, plugin]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Attach the files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber art/GPP-Link-Release/*.zip art/GPP-Link-Mac/*.zip art/GPP-Link-Windows/*.zip
