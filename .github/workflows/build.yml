
  plugin:
    needs: test
    runs-on: ubuntu-24.04
    env:
      SDK_COMMIT: febd2ca5bd9eb16c4a412837196e145566bc981b   # Akai MPC Plugin SDK, the version this was tested with
    steps:
      - uses: actions/checkout@v4
      - name: Get Akai's MPC Plugin SDK
        uses: actions/checkout@v4
        with:
          repository: inmusic-software/mpc-plugin-builder-sdk
          ref: ${{ env.SDK_COMMIT }}
          path: sdk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build the plugin for Gen1 (arm32) and Gen2 (arm64)
        run: python sdk/tools/build.py plugin
      - name: SDK host simulator test
        run: sdk/.sdk-tools/host_sim plugin/build/native/mpc-link.so test --wav plugin/build/test.wav
      - name: Plugin in a pretend MPC, against a live hub
        run: |
          (cd hub && go build -o ../hub-linux .)
          c++ -std=c++17 -Wall -Wextra -O1 -Isdk/framework tests/plugin_host_test.cpp -ldl -lpthread -o plugin_host_test
          sh tests/plugin_test.sh ./hub-linux ./plugin_host_test plugin/build/native/mpc-link.so
      - name: Package
        run: python sdk/tools/package.py plugin --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: MPC-Link-Plugin
          path: dist/*.zip
