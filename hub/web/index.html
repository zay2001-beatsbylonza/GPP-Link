<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPP Link</title>
<style>
  :root { --bg:#000; --card:#111; --ink:#fff; --dim:#9a9a9a; --line:#2a2a2a; --accent:#e53935; --yellow:#ffd400; --ok:#ffd400; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { padding:20px 16px 8px; }
  h1 { margin:0; font-size:22px; letter-spacing:.5px; }
  h1 span { color:var(--yellow); }
  .sub { color:var(--dim); font-size:13px; margin-top:2px; }
  main { padding:0 16px 40px; max-width:720px; margin:0 auto; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--accent); margin:22px 0 8px; }
  .mpcs { display:flex; gap:8px; flex-wrap:wrap; }
  .mpc { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:8px 14px; cursor:pointer; color:var(--ink); font:inherit; }
  .mpc.on { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  .mpc small { color:var(--dim); margin-left:6px; }
  .empty { color:var(--dim); font-size:14px; }
  input[type=search]:focus { outline:2px solid var(--yellow); }
  input[type=search] { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; }
  ul { list-style:none; margin:10px 0 0; padding:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  li { display:flex; align-items:center; gap:10px; padding:10px 12px; border-top:1px solid var(--line); }
  li:first-child { border-top:0; }
  .f { flex:1; min-width:0; }
  .f b { display:block; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .f i { display:block; font-style:normal; color:var(--dim); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  button.send { border:0; background:var(--accent); color:#fff; border-radius:8px; padding:8px 12px; font:inherit; font-weight:600; cursor:pointer; white-space:nowrap; }
  button.send:disabled { opacity:.35; cursor:default; }
  button.cue { border:1px solid var(--yellow); background:transparent; color:var(--yellow); border-radius:8px; padding:7px 10px; font:inherit; font-weight:600; cursor:pointer; }
  button.cue:disabled { opacity:.35; cursor:default; }
  button.send.done { background:var(--yellow); color:#000; }
  /* phones: name on its own line, buttons under it, so beat names aren't cut off */
  @media (max-width: 560px) {
    li { flex-wrap: wrap; }
    .f { flex: 1 1 100%; }
    .f b, .f i { white-space: normal; overflow-wrap: anywhere; }
    button.send { flex: 1; }
  }
  .gpp { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .gpp p { margin:0 0 10px; }
  .gpp .dim { color:var(--dim); font-size:13px; }
  .gpp .row { display:flex; gap:8px; flex-wrap:wrap; }
  .gpp input { flex:1 1 160px; min-width:0; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:#000; color:var(--ink); font:600 18px/1.2 ui-monospace, Menlo, Consolas, monospace; letter-spacing:2px; text-transform:uppercase; }
  .gpp input:focus { outline:2px solid var(--yellow); }
  .gpp button { border:0; border-radius:8px; padding:10px 16px; font:inherit; font-weight:600; cursor:pointer; }
  .gpp .go { background:var(--accent); color:#fff; }
  .gpp .go:disabled { opacity:.5; cursor:default; }
  .gpp .off { background:transparent; color:var(--dim); border:1px solid var(--line); }
  .gpp .off.sure { color:#fff; border-color:var(--accent); }
  .gpp .store { color:var(--yellow); font-weight:700; }
  .gpp .note { border-left:3px solid var(--yellow); padding:6px 10px; margin:0 0 10px; font-size:14px; }
  .gpp .note.bad { border-color:var(--accent); }
  .gpp ul.skips { margin:0 0 10px; font-size:13px; }
  .gpp ul.skips li { padding:6px 10px; color:var(--dim); }
  .smp { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .smp p { margin:0 0 10px; }
  .smp .dim { color:var(--dim); font-size:13px; }
  .smp .on { color:var(--yellow); font-weight:700; }
  .smp .note { border-left:3px solid var(--yellow); padding:6px 10px; margin:0 0 10px; font-size:14px; }
  .smp .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .smp input { flex:1 1 160px; min-width:0; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:#000; color:var(--ink); font:inherit; }
  .smp input:focus { outline:2px solid var(--yellow); }
  .smp button { border:0; border-radius:8px; padding:9px 14px; font:inherit; font-weight:600; cursor:pointer; white-space:nowrap; }
  .smp button:disabled { opacity:.4; cursor:default; }
  .smp .pick { background:var(--yellow); color:#000; }
  .smp .ghost { background:transparent; color:var(--dim); border:1px solid var(--line); }
  .smp .eject { background:transparent; color:#fff; border:1px solid var(--accent); }
  .smp ul { margin:0 0 10px; }
  .smp select { flex:1 1 200px; min-width:0; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:#000; color:var(--ink); font:inherit; }
  .smp .sendfolder { background:var(--accent); color:#fff; }
  button.tofolder { border:1px solid var(--yellow); background:transparent; color:var(--yellow); border-radius:8px; padding:7px 10px; font:inherit; font-weight:600; cursor:pointer; white-space:nowrap; }
  button.togpp, button.tosample { border:0; background:var(--accent); color:#fff; border-radius:8px; padding:8px 12px; font:inherit; font-weight:600; cursor:pointer; white-space:nowrap; }
  button.tosample { background:var(--yellow); color:#000; }
  button.tofolder:disabled, button.togpp:disabled, button.tosample:disabled { opacity:.35; cursor:default; }
  button.done { background:var(--yellow) !important; color:#000 !important; border-color:var(--yellow) !important; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--yellow); color:#000; padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>GPP <span>Link</span></h1>
  <div class="sub" id="hubline">Connecting…</div>
</header>
<main>
  <h2>Send to</h2>
  <div class="mpcs" id="mpcs"><span class="empty">No MPC connected yet. Open the GPP Link plugin on an MPC.</span></div>

  <h2>Get Producers Paid</h2>
  <div class="gpp" id="gpp"><span class="empty">Loading…</span></div>

  <h2>MPC SAMPLE GPP</h2>
  <div class="smp" id="smp"><span class="empty">Loading…</span></div>

  <h2>Beats folder</h2>
  <input type="search" id="q" placeholder="Search beats, samples, projects…" autocomplete="off">
  <ul id="files"><li class="empty">Loading…</li></ul>
</main>
<div id="toast"></div>
<script>
let target = null, files = [], devices = [];
try { target = localStorage.getItem('mpclink.target'); } catch (e) {}

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }
function size(n) { return n > 1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1, Math.round(n/1024))+' KB'; }
function ago(t) { const s = Date.now()/1000 - t; return s < 60 ? 'now' : s < 3600 ? Math.round(s/60)+' min ago' : Math.round(s/3600)+' h ago'; }

async function loadHello() {
  const h = await (await fetch('/api/hello')).json();
  $('hubline').textContent = 'Sharing "' + h.folder + '" from ' + h.name;
}
async function loadDevices() {
  devices = await (await fetch('/api/devices')).json();
  const box = $('mpcs');
  if (!devices.length) { box.innerHTML = '<span class="empty">No MPC connected yet. Open the GPP Link plugin on an MPC.</span>'; target = null; renderFiles(); return; }
  if (!devices.some(d => d.name === target)) target = devices[0].name;
  box.innerHTML = devices.map(d =>
    `<button class="mpc ${d.name===target?'on':''}" data-n="${esc(d.name)}">${esc(d.name)}<small>${d.waiting ? d.waiting+' waiting' : ago(d.lastSeen)}</small></button>`).join('');
  box.querySelectorAll('.mpc').forEach(b => b.onclick = () => {
    target = b.dataset.n; try { localStorage.setItem('mpclink.target', target); } catch (e) {}
    loadDevices(); renderFiles();
  });
  renderFiles();
}
async function loadFiles() {
  files = await (await fetch('/api/list')).json() || [];
  renderFiles();
}
function renderFiles() {
  const q = $('q').value.trim().toLowerCase();
  const list = files.filter(f => !q || f.path.toLowerCase().includes(q)).slice(0, 300);
  const ul = $('files');
  if (!list.length) { ul.innerHTML = '<li class="empty">' + (files.length ? 'Nothing matches.' : 'No audio, MIDI or MPC files in this folder yet.') + '</li>'; return; }
  ul.innerHTML = list.map((f, i) => {
    const dir = f.path.includes('/') ? f.path.slice(0, f.path.lastIndexOf('/')) : 'Beats';
    return `<li><div class="f"><b>${esc(f.name)}</b><i>${esc(dir)} · ${size(f.size)}</i></div>
      <button class="cue" data-i="${i}" ${target?'':'disabled'} title="Make this the MPC's Computer Files pick">Cue</button>
      <button class="send" data-i="${i}" ${target?'':'disabled'}>${target ? 'Send to ' + esc(target) : 'Send'}</button>
      ${smp && smp.connected ? `<button class="tosample" data-i="${i}">Send to MPC Sample</button>` : ''}</li>`;
  }).join('');
  ul.querySelectorAll('.cue').forEach(b => b.onclick = async () => {
    const f = list[+b.dataset.i];
    const r = await fetch('/api/cue', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ device: target, path: f.path }) });
    if (r.ok) toast(f.name + ' cued on ' + target + ' (Computer Files)');
    else toast('Could not cue: ' + (await r.text()).trim());
  });
  ul.querySelectorAll('.tosample').forEach(b => b.onclick = async () => {
    const f = list[+b.dataset.i];
    b.disabled = true; b.textContent = 'Copying…';
    const r = await smpPost('/api/sample/send', { path: f.path });
    if (r.ok) { b.textContent = 'On MPC Sample'; b.classList.add('done'); toast(f.name + ' is on the MPC Sample'); loadSample(); }
    else { b.disabled = false; b.textContent = 'Send to MPC Sample'; toast('Could not send: ' + (await r.text()).trim()); }
  });
  ul.querySelectorAll('.send').forEach(b => b.onclick = async () => {
    const f = list[+b.dataset.i];
    const r = await fetch('/api/queue', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ device: target, path: f.path }) });
    if (r.ok) { b.textContent = 'Queued'; b.classList.add('done'); toast(f.name + ' is on its way to ' + target); loadDevices(); }
    else toast('Could not send: ' + (await r.text()).trim());
  });
}
$('q').oninput = renderFiles;
// ---- Get Producers Paid: connect and watch draft uploads ----
let gpp = null, gppSure = false, gppErr = '';
async function loadGPP() {
  try { gpp = await (await fetch('/api/gpp')).json(); } catch (e) { return; }
  renderGPP();
}
function renderGPP() {
  const box = $('gpp'), s = gpp;
  if (!s) return;
  if (document.activeElement && document.activeElement.id === 'gppcode') return; // don't redraw while typing
  const msg = (!s.connected && gppErr) || s.message;
  const note = msg ? `<p class="note ${(gppErr && !s.connected) || ['needs-pair','offline','paused'].includes(s.state) ? 'bad' : ''}">${esc(msg)}</p>` : '';
  const skips = (s.skipped && s.skipped.length) ? `<p class="dim">Not sent (can't be drafts):</p><ul class="skips">${s.skipped.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
  if (!s.connected) {
    const waiting = s.waiting ? `<p class="dim">${s.waiting} beat${s.waiting>1?'s':''} in the Get Producers Paid folder will send once you connect.</p>` : '';
    if (!s.canManage) {
      box.innerHTML = note + `<p>Not connected.</p><p class="dim">To connect your store, open GPP Link on the computer the hub runs on (<b>http://localhost:47800</b>).</p>` + waiting;
      return;
    }
    box.innerHTML = note + `<p>Connect your store, and beats you send with <b>SEND TO GET PRODUCERS PAID</b> become drafts in the app.</p>
      <p class="dim">In the app: <b>Producer → Profile → Connect GPP Link → Get pairing code</b>. The code works once, for 10 minutes.</p>
      <form class="row" id="gppform"><label for="gppcode" class="dim" style="flex-basis:100%">Pairing code</label>
        <input id="gppcode" placeholder="K7Q4-MZP2" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">
        <button class="go" id="gppgo" type="submit">Connect</button></form>` + waiting;
    $('gppform').onsubmit = async e => {
      e.preventDefault();
      const code = $('gppcode').value.trim(); if (!code) return;
      $('gppgo').disabled = true; $('gppgo').textContent = 'Connecting…';
      const r = await fetch('/api/gpp/pair', { method:'POST', headers:{'Content-Type':'application/json','X-GPP-Link':'1'}, body: JSON.stringify({ code }) });
      const t = (await r.text()).trim();
      let msg = t; try { msg = JSON.parse(t).message || t; } catch (e) {}
      gppErr = r.ok ? '' : msg;
      $('gppcode').blur();
      toast(r.ok ? msg : 'Could not connect');
      await loadGPP();
    };
    return;
  }
  let line;
  if (s.state === 'sending' && s.current) line = `Sending <b>${esc(s.current)}</b>…` + (s.waiting > 1 ? ` (${s.waiting-1} more waiting)` : '');
  else if (s.state === 'checking') line = 'Checking the connection…';
  else if (s.waiting) line = `${s.waiting} beat${s.waiting>1?'s':''} waiting to send.`;
  else line = 'Up to date.' + (s.lastSent ? ` Last sent: <b>${esc(s.lastSent)}</b>, ${ago(s.lastSentAt)}.` : '');
  box.innerHTML = `<p>Connected to <span class="store">${esc(s.storeName || 'your store')}</span></p>` + note +
    `<p>${line}</p><p class="dim">${s.sentCount===1 ? '1 beat sent as a draft' : s.sentCount+' beats sent as drafts'}. New beats in the Get Producers Paid folder send by themselves. Finish and publish them in the app.</p>` + skips +
    (s.canManage ? `<div class="row"><button class="off ${gppSure?'sure':''}" id="gppoff">${gppSure ? 'Tap again to disconnect' : 'Disconnect this computer'}</button></div>` +
      (s.keptIn ? `<p class="dim" style="margin-top:10px">The connection is saved in ${esc(s.keptIn)}. It can only add drafts.</p>` : '') : '');
  const off = $('gppoff');
  if (off) off.onclick = async () => {
    if (!gppSure) { gppSure = true; renderGPP(); setTimeout(() => { gppSure = false; renderGPP(); }, 4000); return; }
    gppSure = false;
    const r = await fetch('/api/gpp/disconnect', { method:'POST', headers:{'X-GPP-Link':'1'} });
    toast(r.ok ? 'Disconnected on this computer' : 'Could not disconnect');
    loadGPP();
  };
}

// ---- MPC SAMPLE GPP: the MPC Sample's card over USB-C (SD Card Mode) ----
let smp = null, smpWasOn = null, smpChange = false, smpFolders = [], smpPick = '';
async function loadSampleFolders() {
  try { smpFolders = await (await fetch('/api/sample/folders')).json() || []; } catch (e) {}
}
function smpPost(url, body) {
  return fetch(url, { method:'POST', headers:{'Content-Type':'application/json','X-GPP-Link':'1'}, body: JSON.stringify(body || {}) });
}
async function loadSample() {
  try { smp = await (await fetch('/api/sample')).json(); } catch (e) { return; }
  if (smp.connected && smpWasOn !== true) await loadSampleFolders();
  if (smpWasOn !== null && smpWasOn !== smp.connected) { toast(smp.connected ? 'MPC Sample connected' : 'MPC Sample unplugged'); renderFiles(); }
  smpWasOn = smp.connected;
  renderSample();
}
function renderSample() {
  const box = $('smp'), s = smp;
  if (!s) return;
  if (document.activeElement && ['smpfolder','smpdir'].includes(document.activeElement.id)) return; // don't redraw while typing or picking
  const how = `<p class="note">Put your MPC Sample in <b>SD Card Mode</b> and plug it into this computer with USB-C.</p>`;
  if (!s.connected) {
    if (!s.drive || smpChange) {
      if (!s.canManage) { box.innerHTML = how + `<p class="dim">Pick the MPC Sample's drive on the computer the hub runs on (<b>http://localhost:47800</b>).</p>`; return; }
      const picks = s.candidates.length
        ? `<p>Which drive is your MPC Sample? You only pick it once.</p><div class="row">${s.candidates.map(d => `<button class="pick" data-d="${esc(d.name)}">${esc(d.name)}</button>`).join('')}</div>`
        : `<p class="dim">No drives plugged in yet.</p>`;
      box.innerHTML = how + picks + (smpChange && s.drive ? `<div class="row"><button class="ghost" id="smpcancel">Keep ${esc(s.drive)}</button></div>` : '');
      box.querySelectorAll('.pick').forEach(b => b.onclick = async () => {
        const r = await smpPost('/api/sample/pick', { drive: b.dataset.d });
        if (r.ok) { smpChange = false; toast(b.dataset.d + ' is your MPC Sample'); } else toast('Could not pick it: ' + (await r.text()).trim());
        loadSample();
      });
      const c = $('smpcancel'); if (c) c.onclick = () => { smpChange = false; renderSample(); };
      return;
    }
    box.innerHTML = how + `<p class="dim">Waiting for <b>${esc(s.drive)}</b>…</p>` +
      (s.canManage ? `<div class="row"><button class="ghost" id="smpchange">Pick a different drive</button></div>` : '');
    const ch = $('smpchange'); if (ch) ch.onclick = () => { smpChange = true; renderSample(); };
    return;
  }
  const where = s.folder ? esc(s.folder) : 'the top of the card';
  const busy = s.busy ? `<p class="note">Copying <b>${esc(s.busy)}</b>…</p>` : '';
  const folderRow = s.canManage ? `<form class="row" id="smpform"><input id="smpfolder" value="${esc(s.folder)}" placeholder="Folder on the card (blank = top of the card)" autocomplete="off" spellcheck="false"><button class="ghost" type="submit">Save folder</button></form>` : '';
  const list = s.files.slice(0, 300);
  const files = list.length
    ? `<ul>${list.map((f, i) => {
        const dir = f.path.includes('/') ? f.path.slice(0, f.path.lastIndexOf('/')) : 'card';
        return `<li><div class="f"><b>${esc(f.name)}</b><i>${esc(dir)} · ${size(f.size)}</i></div>
          <button class="tofolder" data-i="${i}">Send to Folder</button>
          <button class="togpp" data-i="${i}">Send to GPP</button></li>`; }).join('')}</ul>` + (s.more ? `<p class="dim">Showing the newest files only.</p>` : '')
    : `<p class="dim">No beats on the card yet.</p>`;
  box.innerHTML = `<p><span class="on">MPC Sample connected</span> <span class="dim">(${esc(s.drive)})</span></p>` + busy +
    `<p class="dim">Showing and sending to ${where} on the card. Use <b>Send to MPC Sample</b> on any beat in the Beats folder below.</p>` + folderRow +
    `<p style="margin-top:4px"><b>Send a folder</b> <span class="dim">(sample packs, kits, stems from your Beats folder)</span></p>` +
    (smpFolders.length
      ? `<div class="row"><select id="smpdir">${smpFolders.map(f => `<option value="${esc(f.path)}" ${f.path===smpPick?'selected':''}>${esc(f.path)} (${f.files} file${f.files>1?'s':''}, ${size(f.bytes)})</option>`).join('')}</select><button class="sendfolder" id="smpsenddir" ${s.busy?'disabled':''}>Send Folder to MPC Sample</button></div>`
      : `<p class="dim">No folders with samples in your Beats folder yet.</p>`) +
    `<p class="dim">On the card:</p>` + files +
    (s.canManage ? `<div class="row"><button class="eject" id="smpeject">Eject MPC Sample</button><button class="ghost" id="smpchange">Pick a different drive</button></div>` : '');
  const form = $('smpform');
  if (form) form.onsubmit = async e => {
    e.preventDefault();
    const r = await smpPost('/api/sample/folder', { folder: $('smpfolder').value });
    $('smpfolder').blur();
    toast(r.ok ? 'Saved' : 'Could not save: ' + (await r.text()).trim());
    loadSample();
  };
  const sel = $('smpdir');
  if (sel) sel.onchange = () => { smpPick = sel.value; sel.blur(); };
  const sd = $('smpsenddir');
  if (sd) sd.onclick = async () => {
    const p = $('smpdir').value; smpPick = p;
    sd.disabled = true; sd.textContent = 'Copying…';
    const poll = setInterval(loadSample, 1000);
    const r = await smpPost('/api/sample/sendfolder', { path: p });
    clearInterval(poll);
    const t = (await r.text()).trim();
    let msg = t; try { const j = JSON.parse(t); msg = j.files + ' files are on the MPC Sample in ' + j.saved; } catch (e) {}
    toast(r.ok ? msg : 'Could not send the folder: ' + t);
    loadSample();
  };
  const pull = (b, dest, label, doneLabel) => async () => {
    const f = list[+b.dataset.i];
    box.querySelectorAll('.tofolder,.togpp').forEach(x => x.disabled = true);
    b.textContent = 'Copying…';
    const r = await smpPost('/api/sample/pull', { path: f.path, dest });
    const t = (await r.text()).trim();
    if (r.ok) { toast(f.name + (dest === 'gpp' ? ' is going to Get Producers Paid as a draft' : ' is in From MPC/MPC Sample')); loadFiles(); loadGPP(); }
    else toast('Could not send: ' + t);
    await loadSample();
    if (r.ok) { const nb = box.querySelector(`.${dest==='gpp'?'togpp':'tofolder'}[data-i="${b.dataset.i}"]`); if (nb) { nb.textContent = doneLabel; nb.classList.add('done'); } }
  };
  box.querySelectorAll('.tofolder').forEach(b => b.onclick = pull(b, 'folder', 'Send to Folder', 'In Folder'));
  box.querySelectorAll('.togpp').forEach(b => b.onclick = pull(b, 'gpp', 'Send to GPP', 'Sent to GPP'));
  const ej = $('smpeject');
  if (ej) ej.onclick = async () => {
    ej.disabled = true; ej.textContent = 'Ejecting…';
    const r = await smpPost('/api/sample/eject');
    const t = (await r.text()).trim();
    let msg = t; try { msg = JSON.parse(t).message || t; } catch (e) {}
    toast(r.ok ? msg : 'Could not eject: ' + msg);
    loadSample();
  };
  const ch = $('smpchange'); if (ch) ch.onclick = () => { smpChange = true; smp.connected = false; renderSample(); };
}

loadHello(); loadDevices(); loadFiles(); loadGPP(); loadSample();
setInterval(loadGPP, 4000);
setInterval(loadDevices, 3000);
setInterval(loadFiles, 15000);
setInterval(loadSample, 3000);
setInterval(() => { if (smp && smp.connected) loadSampleFolders(); }, 15000);
</script>
