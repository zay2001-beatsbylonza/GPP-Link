<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPC Link</title>
<style>
  :root { --bg:#000; --card:#111; --ink:#fff; --dim:#9a9a9a; --line:#2a2a2a; --accent:#e53935; --yellow:#ffd400; --ok:#ffd400; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { padding:20px 16px 8px; }
  h1 { margin:0; font-size:22px; letter-spacing:.5px; }
  h1 span { color:var(--yellow); }
  .sub { color:var(--dim); font-size:13px; margin-top:2px; }
  main { padding:0 16px 40px; max-width:720px; margin:0 auto; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--accent); margin:22px 0 8px; }
  .mpcs { display:flex; gap:8px; flex-wrap:wrap; }
  .mpc { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:8px 14px; cursor:pointer; color:var(--ink); font:inherit; }
  .mpc.on { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  .mpc small { color:var(--dim); margin-left:6px; }
  .empty { color:var(--dim); font-size:14px; }
  input[type=search]:focus { outline:2px solid var(--yellow); }
  input[type=search] { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; }
  ul { list-style:none; margin:10px 0 0; padding:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  li { display:flex; align-items:center; gap:10px; padding:10px 12px; border-top:1px solid var(--line); }
  li:first-child { border-top:0; }
  .f { flex:1; min-width:0; }
  .f b { display:block; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .f i { display:block; font-style:normal; color:var(--dim); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  button.send { border:0; background:var(--accent); color:#fff; border-radius:8px; padding:8px 12px; font:inherit; font-weight:600; cursor:pointer; white-space:nowrap; }
  button.send:disabled { opacity:.35; cursor:default; }
  button.send.done { background:var(--yellow); color:#000; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--yellow); color:#000; padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>MPC <span>Link</span></h1>
  <div class="sub" id="hubline">Connecting…</div>
</header>
<main>
  <h2>Send to</h2>
  <div class="mpcs" id="mpcs"><span class="empty">No MPC connected yet. Open the MPC Link plugin on an MPC.</span></div>

  <h2>Beats folder</h2>
  <input type="search" id="q" placeholder="Search beats, samples, projects…" autocomplete="off">
  <ul id="files"><li class="empty">Loading…</li></ul>
</main>
<div id="toast"></div>
<script>
let target = null, files = [], devices = [];
try { target = localStorage.getItem('mpclink.target'); } catch (e) {}

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }
function size(n) { return n > 1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1, Math.round(n/1024))+' KB'; }
function ago(t) { const s = Date.now()/1000 - t; return s < 60 ? 'now' : s < 3600 ? Math.round(s/60)+' min ago' : Math.round(s/3600)+' h ago'; }

async function loadHello() {
  const h = await (await fetch('/api/hello')).json();
  $('hubline').textContent = 'Sharing "' + h.folder + '" from ' + h.name;
}
async function loadDevices() {
  devices = await (await fetch('/api/devices')).json();
  const box = $('mpcs');
  if (!devices.length) { box.innerHTML = '<span class="empty">No MPC connected yet. Open the MPC Link plugin on an MPC.</span>'; target = null; renderFiles(); return; }
  if (!devices.some(d => d.name === target)) target = devices[0].name;
  box.innerHTML = devices.map(d =>
    `<button class="mpc ${d.name===target?'on':''}" data-n="${esc(d.name)}">${esc(d.name)}<small>${d.waiting ? d.waiting+' waiting' : ago(d.lastSeen)}</small></button>`).join('');
  box.querySelectorAll('.mpc').forEach(b => b.onclick = () => {
    target = b.dataset.n; try { localStorage.setItem('mpclink.target', target); } catch (e) {}
    loadDevices(); renderFiles();
  });
  renderFiles();
}
async function loadFiles() {
  files = await (await fetch('/api/list')).json() || [];
  renderFiles();
}
function renderFiles() {
  const q = $('q').value.trim().toLowerCase();
  const list = files.filter(f => !q || f.path.toLowerCase().includes(q)).slice(0, 300);
  const ul = $('files');
  if (!list.length) { ul.innerHTML = '<li class="empty">' + (files.length ? 'Nothing matches.' : 'No audio, MIDI or MPC files in this folder yet.') + '</li>'; return; }
  ul.innerHTML = list.map((f, i) => {
    const dir = f.path.includes('/') ? f.path.slice(0, f.path.lastIndexOf('/')) : 'Beats';
    return `<li><div class="f"><b>${esc(f.name)}</b><i>${esc(dir)} · ${size(f.size)}</i></div>
      <button class="send" data-i="${i}" ${target?'':'disabled'}>${target ? 'Send to ' + esc(target) : 'Send'}</button></li>`;
  }).join('');
  ul.querySelectorAll('.send').forEach(b => b.onclick = async () => {
    const f = list[+b.dataset.i];
    const r = await fetch('/api/queue', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ device: target, path: f.path }) });
    if (r.ok) { b.textContent = 'Queued'; b.classList.add('done'); toast(f.name + ' is on its way to ' + target); loadDevices(); }
    else toast('Could not send: ' + (await r.text()).trim());
  });
}
$('q').oninput = renderFiles;
loadHello(); loadDevices(); loadFiles();
setInterval(loadDevices, 3000);
setInterval(loadFiles, 15000);
</script>
</body>
</html>
